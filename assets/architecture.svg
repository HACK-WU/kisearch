<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="940" height="790" fill="#ffffff" rx="12"/>

  <!-- ============ 1. 交互层 ============ -->
  <rect x="20" y="14" width="900" height="130" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="470" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">交 互 层（Interaction Layer）</text>
  <text x="470" y="50" text-anchor="middle" font-size="9.5" fill="#94a3b8">三种接入方式 · 共享同一核心引擎</text>

  <!-- Web -->
  <rect x="36" y="60" width="270" height="74" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="171" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">◆ Web 前端</text>
  <text x="171" y="93" text-anchor="middle" font-size="9.5" fill="#64748b">浏览器 SPA · 用户直接操作</text>
  <line x1="50" y1="100" x2="292" y2="100" stroke="#bae6fd" stroke-width="1"/>
  <text x="171" y="115" text-anchor="middle" font-size="9" fill="#475569">总览 / 浏览 / 搜索 / 导入 / 写入</text>
  <text x="171" y="128" text-anchor="middle" font-size="8.5" fill="#94a3b8">ki mcp --http --web</text>

  <!-- MCP -->
  <rect x="335" y="60" width="270" height="74" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="470" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">◆ MCP 服务</text>
  <text x="470" y="93" text-anchor="middle" font-size="9.5" fill="#64748b">Agent / IDE 集成 · StreamableHTTP</text>
  <line x1="349" y1="100" x2="591" y2="100" stroke="#fde68a" stroke-width="1"/>
  <text x="470" y="115" text-anchor="middle" font-size="9" fill="#475569">search / import / scope / write / list ...</text>
  <text x="470" y="128" text-anchor="middle" font-size="8.5" fill="#94a3b8">ki mcp --stdio | --http (11 tools)</text>

  <!-- CLI -->
  <rect x="634" y="60" width="270" height="74" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="769" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">◆ CLI 终端</text>
  <text x="769" y="93" text-anchor="middle" font-size="9.5" fill="#64748b">用户终端操作 · 脚本自动化</text>
  <line x1="648" y1="100" x2="890" y2="100" stroke="#bbf7d0" stroke-width="1"/>
  <text x="769" y="115" text-anchor="middle" font-size="9" fill="#475569">search / import / scope / restore / mcp</text>
  <text x="769" y="128" text-anchor="middle" font-size="8.5" fill="#94a3b8">bin/ki.mjs</text>

  <!-- 汇聚箭头 -->
  <line x1="171" y1="144" x2="171" y2="162" stroke="#0284c7" stroke-width="2" marker-end="url(#ac)"/>
  <line x1="470" y1="144" x2="470" y2="162" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="769" y1="144" x2="769" y2="162" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="171" y1="156" x2="470" y2="168" stroke="#94a3b8" stroke-width="1"/>
  <line x1="769" y1="156" x2="470" y2="168" stroke="#94a3b8" stroke-width="1"/>

  <!-- ============ 2. 核心引擎（缩小底部间隙）============ -->
  <rect x="20" y="166" width="900" height="520" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="470" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">核 心 引 擎（KiSearch Core）</text>
  <text x="470" y="202" text-anchor="middle" font-size="9.5" fill="#94a3b8">左侧：数据存储 + 输入　｜　中间：记忆库（长期沉淀）　｜　右侧：查询层（全高贯通）</text>

  <!-- ===== 左侧：数据存储层大框 ===== -->
  <rect x="34" y="218" width="432" height="340" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="250" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">数 据 存 储 层</text>

  <!-- Scope 知识树（左上） -->
  <rect x="46" y="252" width="240" height="165" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="166" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Scope 知识树</text>
  <line x1="56" y1="282" x2="276" y2="282" stroke="#bfdbfe" stroke-width="1"/>
  <text x="58" y="300" font-size="9.5" fill="#334155" font-family="monospace">scope: monitor</text>
  <text x="66" y="318" font-size="9" fill="#64748b">├── Group: 告警系统设计</text>
  <text x="74" y="334" font-size="9" fill="#64748b">│   └── Relation: 告警处理</text>
  <text x="86" y="350" font-size="9" fill="#16a34a">│       └─ 原文 (local KB)</text>
  <text x="66" y="366" font-size="9" fill="#64748b">├── Group: 告警处理服务</text>
  <text x="74" y="382" font-size="9" fill="#64748b">│   └── Relation: ...</text>
  <text x="66" y="398" font-size="9" fill="#94a3b8">└── ...更多 Group</text>

  <!-- 记忆库（右上长条，三行均匀分布且对齐） -->
  <rect x="296" y="252" width="158" height="296" rx="6" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
  <text x="375" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207">记 忆 库</text>
  <text x="375" y="298" text-anchor="middle" font-size="9" fill="#854d0e">(长期沉淀)</text>
  <line x1="306" y1="308" x2="444" y2="308" stroke="#fde68a" stroke-width="1"/>
  <!-- 三行等间距分布，全部居中对齐 -->
  <text x="375" y="360" text-anchor="middle" font-size="9.5" fill="#475569">● Agent 决策与偏好</text>
  <text x="375" y="420" text-anchor="middle" font-size="9.5" fill="#475569">● 项目上下文与经验</text>
  <text x="375" y="480" text-anchor="middle" font-size="9.5" fill="#475569">● 跨会话持久化</text>

  <!-- 向量索引（左下） -->
  <rect x="46" y="428" width="240" height="120" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="166" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">向量索引 (zvec 集合)</text>
  <line x1="56" y1="458" x2="276" y2="458" stroke="#a7f3d0" stroke-width="1"/>
  <text x="58" y="476" font-size="9.5" fill="#334155">● ki-search　内容向量</text>
  <text x="58" y="494" font-size="9.5" fill="#334155">● ki-relation 关系向量</text>
  <text x="58" y="512" font-size="9.5" fill="#334155">● ki-path　路径向量</text>
  <text x="58" y="530" font-size="9.5" fill="#64748b">▸ 混合: 向量 + BM25 + RRF</text>

  <!-- ===== 右侧：查询层（全高，与输入层底部对齐） ===== -->
  <rect x="480" y="218" width="428" height="420" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="694" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">查 询 层（全高贯通）</text>

  <!-- 路径 A -->
  <rect x="496" y="256" width="396" height="115" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="694" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">路径 A · 索引直查</text>
  <text x="512" y="296" font-size="9.5" fill="#334155">① 已知 Group / Relation 名称</text>
  <text x="520" y="314" font-size="9.5" fill="#334155">② 直读 relations-cache + local KB</text>
  <text x="520" y="332" font-size="9.5" fill="#334155">③ 结果：</text>
  <text x="558" y="332" font-size="9.5" fill="#16a34a" font-weight="600">原文交付 ✓</text>
  <line x1="508" y1="344" x2="880" y2="344" stroke="#bae6fd" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="694" y="360" text-anchor="middle" font-size="8.5" fill="#94a3b8">无需向量检索，直接按索引路径读取</text>

  <!-- 路径 B（间隔增大） -->
  <rect x="496" y="404" width="396" height="160" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="694" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">路径 B · 语义检索</text>
  <text x="512" y="444" font-size="9.5" fill="#334155">① 自然语言查询</text>
  <text x="520" y="462" font-size="9.5" fill="#334155">② 混合检索(向量 + BM25 + RRF)</text>
  <text x="520" y="480" font-size="9.5" fill="#334155">③ 结果：</text>
  <text x="558" y="480" font-size="9.5" fill="#ea580c" font-weight="600">向量匹配数据（默认）</text>
  <rect x="524" y="494" width="340" height="44" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="694" y="512" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">┌ 可选：memoryId 反查原文 ─┐</text>
  <text x="694" y="528" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">│ → group / relation / 原文 │</text>
  <text x="694" y="552" text-anchor="middle" font-size="8.5" fill="#94a3b8">← 语义检索也经过记忆库召回 Agent 知识辅助 →</text>

  <!-- ===== 底部：数据输入层 ===== -->
  <rect x="34" y="572" width="432" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="250" y="592" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">数 据 输 入 层</text>

  <rect x="50" y="600" width="190" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="145" y="618" text-anchor="middle" font-size="10" font-weight="600" fill="#047857">● Wiki 导入</text>
  <text x="145" y="628" text-anchor="middle" font-size="8" fill="#475569">外部Wiki · 结构化Markdown</text>

  <rect x="260" y="600" width="190" height="32" rx="6" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1"/>
  <text x="355" y="618" text-anchor="middle" font-size="10" font-weight="600" fill="#a21caf">● AI 记忆存储</text>
  <text x="355" y="628" text-anchor="middle" font-size="8" fill="#475569">Agent沉淀 · 原文+关键词</text>

  <!-- 写入箭头 -->
  <line x1="145" y1="632" x2="145" y2="564" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 2"/>
  <line x1="355" y1="632" x2="355" y2="564" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)" stroke-dasharray="4 2"/>
  <text x="250" y="556" text-anchor="middle" font-size="9" fill="#64748b">写入 ↑</text>

  <!-- ===== 关联箭头（文字放在箭头下方） ===== -->

  <!-- 路径A → Scope知识树（紫色）：水平线，文字在下方 -->
  <path d="M 496 314 L 290 314" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="393" y="330" text-anchor="middle" font-size="9.5" fill="#7c3aed" font-weight="600">直读 Scope 树</text>

  <!-- 路径B → 向量索引（绿色）：水平线，文字在下方 -->
  <path d="M 496 480 L 290 480" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="393" y="496" text-anchor="middle" font-size="9.5" fill="#16a34a" font-weight="600">检索向量</text>

  <!-- 路径B反查 → Scope树（绿色虚线）：向下绕行 -->
  <path d="M 510 550 L 166 550 L 166 420" fill="none" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="330" y="542" text-anchor="middle" font-size="9.5" fill="#16a34a" font-style="italic">反查原文</text>

  <!-- 语义检索 → 记忆库（橙色短线） -->
  <path d="M 496 450 L 456 450" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="4 2" marker-end="url(#ao)"/>
  <text x="476" y="464" text-anchor="start" font-size="8.5" fill="#ea580c" font-style="italic">经过记忆库</text>

  <!-- ============ 3. 底部说明（无横线分隔） ============ -->
  <text x="30" y="708" font-size="10.5" fill="#64748b"><tspan font-weight="700" fill="#7e22ce">交互层：</tspan>Web（用户浏览器）· MCP（Agent/IDE）· CLI（用户终端）→ 三者共享同一核心引擎</text>
  <text x="30" y="726" font-size="10" fill="#94a3b8"><tspan font-weight="700" fill="#0369a1">Web：</tspan>5 页面　<tspan font-weight="700" fill="#b45309">MCP：</tspan>11 工具　<tspan font-weight="700" fill="#15803d">CLI：</tspan>search/import/scope/mcp</text>
  <text x="30" y="744" font-size="9.5" fill="#cbd5e1"><tspan font-weight="700" fill="#b45309">写入：</tspan>输入层(Wiki/AI记忆) → 存储层(Group树→Relation→原文+向量)　<tspan font-weight="700" fill="#6d28d9">直查：</tspan>路径A ← 直接读Scope树　<tspan font-weight="700" fill="#15803d">检索：</tspan>路径B ← 向量混合检索(默认匹配数据) · 可选memoryId反查原文</text>
</svg>
