<style>
/* 浏览页特有 */
.ki-filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ki-doc-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; border-radius: var(--ki-radius-sm);
  border: 1px solid var(--ki-color-border); margin-bottom: 8px;
  background: var(--ki-color-surface); cursor: pointer; transition: border-color var(--ki-motion-fast);
}
.ki-doc-item:hover { border-color: color-mix(in srgb, var(--ki-color-primary) 30%, transparent); }
.ki-doc-item__name { font-weight: 600; font-size: var(--ki-font-size-md); color: var(--ki-color-text); }
.ki-doc-item__path { font-size: var(--ki-font-size-xs); color: var(--ki-color-text-subtle); font-family: var(--ki-font-mono); margin-top: 2px; }
.ki-doc-item__snippet { font-size: var(--ki-font-size-sm); color: var(--ki-color-text-muted); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
.ki-doc-item__meta { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ki-rel-item { cursor: pointer; }
.ki-rel-item:hover .ki-doc-item__name { color: var(--ki-color-primary); }

/* ── Group 树与文档区独立滚动兜底 ── */
#groupTree {
  max-height: calc(100vh - 260px);
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
}
#groupTree::-webkit-scrollbar { width: 6px; }
#groupTree::-webkit-scrollbar-thumb { background: var(--ki-color-scrollbar); border-radius: 3px; }
#groupTree::-webkit-scrollbar-track { background: transparent; }

#docList {
  max-height: calc(100vh - 300px);
  overflow-y: auto;
  overflow-x: hidden;
}
#docList::-webkit-scrollbar { width: 6px; }
#docList::-webkit-scrollbar-thumb { background: var(--ki-color-scrollbar); border-radius: 3px; }
#docList::-webkit-scrollbar-track { background: transparent; }

/* ── 文件夹层级树（Finder 风格，纯目录，层级区分） ── */
.ki-tree-root { display: flex; flex-direction: column; gap: 1px; }
/* 一级目录：粗体大号 */
.ki-tree-root > .ki-tree-dir {
  font-size: var(--ki-font-size-lg);
  font-weight: 700;
  padding: 7px 8px;
  margin-top: 4px;
}
.ki-tree-root > .ki-tree-dir:first-child { margin-top: 0; }
/* 子级容器：缩进 + 左侧引导线 */
.ki-tree-group {
  padding-left: 14px;
  margin-left: 9px;
  border-left: 1px solid var(--ki-color-border);
  display: flex; flex-direction: column; gap: 1px;
  margin-top: 2px; margin-bottom: 4px;
  animation: ki-tree-expand 0.15s ease;
}
@keyframes ki-tree-expand {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 二级目录：中等 */
.ki-tree-group > .ki-tree-dir {
  font-size: var(--ki-font-size-md);
  font-weight: 600;
  padding: 4px 8px;
}
/* 三级及更深：更轻 */
.ki-tree-group .ki-tree-group > .ki-tree-dir {
  font-size: var(--ki-font-size-sm);
  font-weight: 500;
  color: var(--ki-color-text-muted);
}
.ki-tree-dir {
  display: flex; align-items: center; gap: 6px;
  border-radius: 5px; cursor: pointer; user-select: none;
  white-space: nowrap; line-height: 1.5;
  transition: background var(--ki-motion-fast);
  color: var(--ki-color-text);
}
.ki-tree-dir:hover { background: var(--ki-color-hover); }
.ki-tree-dir--active {
  background: color-mix(in srgb, var(--ki-color-primary) 10%, transparent);
  color: var(--ki-color-primary);
}
.ki-tree-arrow { width: 12px; font-size: 9px; color: var(--ki-color-text-subtle); flex-shrink: 0; text-align: center; }
.ki-tree-icon { width: 16px; height: 16px; flex-shrink: 0; }
.ki-tree-dir__label { overflow: hidden; text-overflow: ellipsis; }
.ki-tree-dir .ki-heat { margin-left: auto; }
/* 原文抽屉 */
.ki-drawer {
  position: fixed; top: 0; right: -640px; width: min(640px, 92vw); height: 100vh;
  background: var(--ki-color-surface); box-shadow: var(--ki-shadow-2);
  transition: right 0.3s ease; z-index: 1000; display: flex; flex-direction: column;
}
.ki-drawer--open { right: 0; }
.ki-drawer__head {
  display: flex; align-items: center; gap: 12px; padding: 16px 20px;
  border-bottom: 1px solid var(--ki-color-border); flex-shrink: 0;
}
.ki-drawer__title { font-weight: 600; font-size: var(--ki-font-size-lg); flex: 1; min-width: 0; }
.ki-drawer__body { flex: 1; overflow-y: auto; padding: 20px; }
.ki-markdown { line-height: 1.7; font-size: var(--ki-font-size-md); }
.ki-markdown h1 { font-size: 20px; margin: 16px 0 8px; }
.ki-markdown h2 { font-size: 17px; margin: 14px 0 6px; }
.ki-markdown h3 { font-size: 15px; margin: 12px 0 4px; }
.ki-markdown p { margin: 8px 0; }
.ki-markdown ul, .ki-markdown ol { padding-left: 20px; margin: 8px 0; }
.ki-markdown code { font-family: var(--ki-font-mono); font-size: 12px; background: var(--ki-color-bg-muted); padding: 1px 5px; border-radius: 4px; }
.ki-markdown pre { background: var(--ki-color-bg); padding: 12px; border-radius: var(--ki-radius-sm); overflow-x: auto; font-family: var(--ki-font-mono); font-size: 12px; margin: 8px 0; }
.ki-markdown blockquote { border-left: 3px solid var(--ki-color-primary); padding-left: 12px; color: var(--ki-color-text-muted); margin: 8px 0; }
.ki-drawer__scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 999; display: none; }
.ki-drawer__scrim--show { display: block; }
</style>
</head>

  const fallbackBody = (name) =>
    '# ' + name + '\n\n（该文档为演示数据，原文以 get-module-info 返回的 Markdown 为准。）\n\n## 说明\n\n- 本 demo 仅展示浏览交互，不接真实后端。\n- 原文内容来自 relations-cache.json / index.json。';

  /* ── 渲染 Group 树（纯目录层级，文件夹图标，可折叠展开） ── */
  const ICON_FOLDER = '<svg class="ki-tree-icon" viewBox="0 0 16 16" fill="none"><path d="M1.5 3.2c0-.5.4-.9.9-.9h3.2l1.5 1.6h6c.5 0 .9.4.9.9v7.1c0 .5-.4.9-.9.9H2.4c-.5 0-.9-.4-.9-.9V3.2z" fill="#7db3ef" stroke="#5f97d6" stroke-width="0.6"/></svg>';
  let currentScope = 'monitor';
  let activeGroup = '';

  function renderTree(scope) {
    currentScope = scope;
    const tree = treeByScope[scope] || [];
    $('treeMeta').textContent = tree.length + ' 个目录';
    if (tree.length === 0) {
      $('groupTree').innerHTML = '<div class="ki-empty" style="padding:24px"><div><h3>空知识库</h3><p>该 scope 暂无 Group，可前往上传导入。</p></div></div>';
      return;
    }
    const html = [];
    const walk = (items) => {
      items.forEach((n) => {
        const hasSub = n.children && n.children.length > 0;
        const isActive = n.name === activeGroup;
        html.push(
          '<div class="ki-tree-dir' + (n.open ? ' ki-tree-dir--open' : '') + (isActive ? ' ki-tree-dir--active' : '') + '" data-name="' + n.name + '" data-group="' + n.name + '">' +
            '<span class="ki-tree-arrow">' + (hasSub ? (n.open ? '▾' : '▸') : '') + '</span>' +
            ICON_FOLDER +
            '<span class="ki-tree-dir__label">' + n.name + '</span>' +
            (n.heat ? '<span class="ki-heat ki-heat--' + n.heat + '">' + n.heat + '</span>' : '') +
          '</div>'
        );
        if (hasSub && n.open) {
          html.push('<div class="ki-tree-group">');
          walk(n.children);
          html.push('</div>');
        }
      });
    };
    html.push('<div class="ki-tree-root">');
    walk(tree);
    html.push('</div>');
    $('groupTree').innerHTML = html.join('');

    // 点击目录：翻转数据 open → 重渲染 → 保持选中并加载文档
    $('groupTree').querySelectorAll('.ki-tree-dir').forEach((node) => {
      node.addEventListener('click', () => {
        const name = node.dataset.name;
        toggleOpen(tree, name);
        activeGroup = name;
        renderTree(currentScope);
        renderDocs(name);
      });
    });

    // 默认选中第一个目录（一级目录展开）
    if (!activeGroup && tree.length > 0) {
      activeGroup = tree[0].name;
      renderDocs(activeGroup);
    }
  }

  function toggleOpen(items, name) {
    for (const n of items) {
      if (n.name === name) {
        n.open = !n.open;
        return;
      }
      if (n.children && n.children.length > 0) toggleOpen(n.children, name);
    }
  }

  function setAllOpen(items, open) {
    items.forEach((n) => {
      if (n.children && n.children.length > 0) {
        n.open = open;
        setAllOpen(n.children, open);
      }
    });
  }

  $('btnExpandAll').addEventListener('click', () => {
    setAllOpen(treeByScope[currentScope] || [], true);
    renderTree(currentScope);
  });
  $('btnCollapseAll').addEventListener('click', () => {
    setAllOpen(treeByScope[currentScope] || [], false);
    renderTree(currentScope);
  });

  function clearTreeActive() {
    $('groupTree').querySelectorAll('.ki-tree-dir--active').forEach((x) =>
      x.classList.remove('ki-tree-dir--active'));
  }

  function renderDocs(group) {
    if (!group) { $('docList').innerHTML = ''; return; }
    let docs = docsByGroup[group];
    if (!docs) {
      docs = [
        { id: group + '-ov', name: group + ' · 概述', path: 'docs/' + group + '/overview.md#1', tags: [], heat: 'warm', snippet: '【' + group + '】分组概述文档：包含该目录下的核心概念、设计目标、适用场景与基本使用说明，作为该模块的入口指引……' },
        { id: group + '-d1', name: group + ' · 实现详解', path: 'docs/' + group + '/detail.md#1', tags: [], heat: 'warm', snippet: '【' + group + '】实现详解：深入展开架构设计、核心流程、配置参数、数据结构与关键算法，适合需要二次开发或深度排错的场景……' },
        { id: group + '-d2', name: group + ' · 最佳实践', path: 'docs/' + group + '/best-practice.md#1', tags: [], heat: 'warm', snippet: '【' + group + '】最佳实践：汇总线上运维经验，包含常见坑点、性能调优建议、故障排查清单与监控告警配置……' },
        { id: group + '-d3', name: group + ' · 变更记录', path: 'docs/' + group + '/changelog.md#1', tags: [], heat: 'warm', snippet: '【' + group + '】变更记录：按版本记录该模块的功能新增、问题修复与不兼容变更，便于升级评估……' },
        { id: group + '-d4', name: group + ' · FAQ', path: 'docs/' + group + '/faq.md#1', tags: [], heat: 'warm', snippet: '【' + group + '】常见问题：收集高频疑问与解答，涵盖配置、部署、排错、性能等维度……' },
      ];
    }
    const tag = $('tagFilter').value;
    const kw = $('docSearch').value.trim().toLowerCase();
    let filtered = docs;
    if (tag) filtered = filtered.filter((d) => d.tags.includes(tag));
    if (kw) filtered = filtered.filter((d) => d.name.toLowerCase().includes(kw) || d.snippet.toLowerCase().includes(kw));
    $('docMeta').textContent = group + ' · ' + filtered.length + ' 条';

    if (filtered.length === 0) {
      $('docList').innerHTML = '<div class="ki-empty" style="padding:32px"><div><h3>无匹配文档</h3><p>调整 tag / 关键词过滤后重试。</p></div></div>';
      return;
    }
    $('docList').innerHTML = filtered.map((d) =>
      '<div class="ki-doc-item ki-rel-item" data-id="' + d.id + '">' +
        '<span class="ki-scope-name__dot ki-dot--' + (d.heat === 'hot' ? 'orange' : d.heat === 'warm' ? 'teal' : 'gray') + '" style="margin-top:3px"></span>' +

          '<div class="ki-doc-item__name">' + d.name + '</div>' +
          '<div class="ki-doc-item__path">' + d.path + '</div>' +
          '<div class="ki-doc-item__snippet">' + d.snippet + '</div>' +
          '<div class="ki-doc-item__meta">' +
            '<span class="ki-heat ki-heat--' + d.heat + '">' + d.heat + '</span>' +
            d.tags.map((t2) => '<span class="ki-badge ki-badge--reg">' + t2 + '</span>').join('') +
          '</div>' +
        '</div>' +
        '<span class="ki-cell-sub" style="align-self:center">查看原文 ›</span>' +
      '</div>'
    ).join('');

    $('docList').querySelectorAll('.ki-rel-item').forEach((el) => {
      el.addEventListener('click', () => openDoc(el.dataset.id));
    });
  }

  /* ── 原文抽屉 ── */
  function openDoc(id) {
    const raw = rawByDoc[id] || { title: id, body: fallbackBody(id) };
    $('drawerTitle').textContent = raw.title;
    $('drawerBody').innerHTML = renderMarkdown(raw.body);
    $('drawer').classList.add('ki-drawer--open');
    $('drawerScrim').classList.add('ki-drawer__scrim--show');
  }
  function closeDrawer() {
    $('drawer').classList.remove('ki-drawer--open');
    $('drawerScrim').classList.remove('ki-drawer__scrim--show');
  }
  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawerScrim').addEventListener('click', closeDrawer);

  /* 简易 Markdown 渲染（演示用，非完整实现） */
  function renderMarkdown(md) {
    let out = md
      .replace(/^### (.*)$/gm, '<h3>$1</h3>')
      .replace(/^## (.*)$/gm, '<h2>$1</h2>')
      .replace(/^# (.*)$/gm, '<h1>$1</h1>')
      .replace(/^> (.*)$/gm, '<blockquote>$1</blockquote>')
      .replace(/^- (.*)$/gm, '<li>$1</li>')
      .replace(/^(\d+)\. (.*)$/gm, '<li>$2</li>');
    // 聚合列表
    out = out.replace(/(<li>.*<\/li>)(\n?)+/g, '<ul>$1</ul>');
    // 行内 code
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 代码块
    out = out.replace(/```[\s\S]*?```/g, (m) => {
      const code = m.replace(/```\w*\n?/, '').replace(/\n?```/, '');
      return '<pre>' + code.replace(/</g, '&lt;') + '</pre>';
    });
    // 段落
    out = out.split('\n').filter((l) => l.trim()).map((l) => {
      if (/^<[hup]/.test(l)) return l;
      return '<p>' + l + '</p>';
    }).join('');
    return out;
  }

  /* ── scope 切换 ── */
  $('scopeSelect').addEventListener('change', (e) => {
    activeGroup = '';
    renderTree(e.target.value);
  });
  $('tagFilter').addEventListener('change', () => {
    const active = $('groupTree').querySelector('.ki-tree-dir--active');
    if (active) renderDocs(active.dataset.group);
  });
  $('docSearch').addEventListener('input', () => {
    const active = $('groupTree').querySelector('.ki-tree-dir--active');
    if (active) renderDocs(active.dataset.group);
  });

  const urlScope = new URLSearchParams(location.search).get('scope');
  if (urlScope && $('scopeSelect').querySelector('option[value="' + urlScope + '"]')) {
    $('scopeSelect').value = urlScope;
  }
  setTimeout(() => renderTree($('scopeSelect').value), 700);
